name: Actualizar Trakt automaticamente
on:
  workflow_dispatch:
  schedule:
    - cron: '37 7 * * *'
permissions:
  contents: write
concurrency:
  group: trakt-sincronizacion
  cancel-in-progress: false
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detectar catalogo TMDB
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: python monitor.py
      - name: Verificar disponibilidad en Espana
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          VERIFICAR_POR_PLATAFORMA: '1000'
        run: python verificar_disponibilidad.py
      - name: Comprobar bajas confirmadas y liberar espacio
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          TRAKT_CREDENTIALS_JSON: ${{ secrets.TRAKT_CREDENTIALS_JSON }}
          MODO_BAJAS: simular
        run: python depurar_trakt.py
      - name: Incorporar nuevos titulos
        env:
          TRAKT_CREDENTIALS_JSON: ${{ secrets.TRAKT_CREDENTIALS_JSON }}
          MODO_CARGA: escribir
          MAX_POR_LISTA: '100'
        run: python carga_trakt_segura.py
      - name: Publicar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-trakt-dinamico
          path: |
            novedades.json
            verificacion_disponibilidad.json
            informe_bajas_trakt.json
            informe_carga_trakt.json
          if-no-files-found: warn
          retention-days: 14
      - name: Guardar estados
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado_catalogo.json
          if [ -f estado_bajas_trakt.json ]; then
            git add estado_bajas_trakt.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar estados de catalogo y bajas"
            git push
          fi

