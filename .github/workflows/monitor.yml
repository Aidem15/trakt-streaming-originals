name: Monitor novedades de plataformas
on:
  workflow_dispatch:
  schedule:
    - cron: '37 7 * * *'
permissions:
  contents: write
concurrency:
  group: monitor-novedades
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detectar novedades
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: python monitor.py
      - name: Comprobar Trakt y leer novedades (solo lectura)
        env:
          TRAKT_CREDENTIALS_JSON: ${{ secrets.TRAKT_CREDENTIALS_JSON }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: python probar_trakt.py
      - name: Publicar resultados descargables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novedades-plataformas
          path: novedades.json
          if-no-files-found: warn
          retention-days: 14
      - name: Guardar estado para la siguiente ejecución
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado_catalogo.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar muestra de plataformas"
            git push
          fi

